workflows:
  android-workflow:
    name: ShotScore AI APK
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
